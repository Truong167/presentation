uses: Truong167/test/.woodpecker.yml@main
environment: ${environment}
with:
  component: $target
  validate_command: test -f index.html && echo "index.html OK" || exit 1
  deploy_image: node:20-alpine

params:
  - name: target
    type: select
    options:
      - fe
      - be
  - name: environment
    type: select
    options:
      - dev
      - prod
    default: dev
  - name: notify_slack
    type: boolean
    default: "false"

when:
  event: manual
  evaluate: target == "fe"

steps:
  - name: notify
    image: alpine:3.19
    commands:
      - echo "FE deploy complete"
