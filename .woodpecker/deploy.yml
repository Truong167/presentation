inputs:
  component:
    type: string
    required: true
    description: "Component name (fe or be)"
  validate_command:
    type: string
    required: true
    description: "Command to run during validation step"
  deploy_image:
    type: string
    default: "alpine:3.19"
    description: "Docker image for deploy step"

steps:
  - name: validate
    image: node:20-alpine
    commands:
      - echo "Validating ${inputs.component}..."
      - ${inputs.validate_command}

  - name: deploy
    image: ${inputs.deploy_image}
    environment:
      API_KEY:
        from_secret: api_key
    commands:
      - echo "=== Deployment Info ==="
      - echo "Component    = ${inputs.component}"
      - echo "Environment  = $environment"
      - echo "Notify Slack = $notify_slack"
      - echo ""
      - echo "=== Secret Verification ==="
      - echo "API_KEY length     = $(echo -n $API_KEY | wc -c)"
