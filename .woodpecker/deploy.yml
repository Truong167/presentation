inputs:
  validate_command:
    type: string
    required: true
    description: "Command to run during validation step"

params:
  - name: type
    type: select
    options:
      - fe
      - be
  - name: environment
    type: select
    options:
      - dev
      - prod
    default: dev

  - name: notify_slack
    type: boolean
    default: "false"

steps:
  - name: validate
    image: node:20-alpine
    commands:
      - ${inputs.validate_command}

  - name: deploy
    image: alpine:3.19
    environment:
      API_KEY:
        from_secret: api_key
    commands:
      - echo "=== Deployment Info ==="
      - echo "Environment  = $environment"
      - echo "Notify Slack = $notify_slack"
      - echo ""
      - echo "=== Secret Verification ==="
      - echo "API_KEY length     = $(echo -n $API_KEY | wc -c)"
