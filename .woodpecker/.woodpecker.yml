params:
  - name: environment
    type: select
    options:
      - dev
      - prod
    default: dev

  - name: notify_slack
    type: boolean
    default: "false"

when:
  event: manual

steps:
  - name: validate
    image: node:20-alpine
    commands:
      - echo "Validating HTML files..."
      - test -f index.html && echo "index.html OK" || exit 1

  - name: deploy
    image: alpine:3.19
    environment:
      API_KEY:
        from_secret: api_key
      DEPLOY_TOKEN:
        from_secret: deploy_token
      DB_URL:
        from_secret: db_url
    commands:
      - echo "=== Deployment Info ==="
      - echo "Environment  = $environment"
      - echo "API Key      = $API_KEY"
      - echo "Deploy Token = $DEPLOY_TOKEN"
      - echo "DB URL       = $DB_URL"
      - echo "Notify Slack = $notify_slack"
      - echo "======================"
