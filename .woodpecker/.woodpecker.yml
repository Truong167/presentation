params:
  - name: environment
    type: select
    options:
      - dev
      - prod
    default: dev

  - name: notify_slack
    type: boolean
    default: "false"

when:
  event: manual

steps:
  - name: validate
    image: node:20-alpine
    commands:
      - echo "Validating HTML files..."
      - test -f index.html && echo "index.html OK" || exit 1

  - name: deploy
    image: alpine:3.19
    environment:
      API_KEY:
        from_secret: api_key
      DEPLOY_TOKEN:
        from_secret: deploy_token
      DB_URL:
        from_secret: db_url
    commands:
      - echo "=== Deployment Info ==="
      - echo "Environment  = $environment"
      - echo "Notify Slack = $notify_slack"
      - echo ""
      - echo "=== Secret Verification ==="
      - echo "API_KEY length     = $(echo -n $API_KEY | wc -c)"
      - echo "API_KEY md5        = $(echo -n $API_KEY | md5sum | cut -d' ' -f1)"
      - echo "DEPLOY_TOKEN length= $(echo -n $DEPLOY_TOKEN | wc -c)"
      - echo "DEPLOY_TOKEN md5   = $(echo -n $DEPLOY_TOKEN | md5sum | cut -d' ' -f1)"
      - echo "DB_URL length      = $(echo -n $DB_URL | wc -c)"
      - echo "DB_URL md5         = $(echo -n $DB_URL | md5sum | cut -d' ' -f1)"
      - echo "======================"
